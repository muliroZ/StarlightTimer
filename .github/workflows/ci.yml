name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build do backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e verificar o projeto
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests verify