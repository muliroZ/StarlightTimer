name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: CI backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e verificar o projeto
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests verify

  frontend:
    name: CI frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Linter
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Salvar build
        uses: actions/upload-artifact@v7
        with:
          name: dist-build
          path: frontend/dist/
          retention-days: 7