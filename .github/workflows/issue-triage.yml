name: Triagem de Issues
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'needs_triage')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts/triage.js
          sparse-checkout-cone-mode: false

      - name: Executar script de triagem
        uses: actions/github-script@v7
        with:
          script: |
            const triage = require('${{ github.workspace }}/.github/scripts/triage.js');
            await triage({ github, context, core });