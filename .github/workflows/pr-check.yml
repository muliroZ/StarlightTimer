name: Checagem de Pull Request
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts/pr-check.js
          sparse-checkout-cone-mode: false

      - name: Executar script de checagem
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('${{ github.workspace }}/.github/scripts/pr-check.js');
            await check({ github, context, core });